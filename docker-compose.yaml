services:
  base-api:
    build: .
    container_name: base-api
    # Development: live code mount + auto-reload (the image alone runs without them)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      - MONGODB_URI=mongodb://base-mongo:27017
      - MONGO_DB=${MONGO_DB:-base_api_db}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-[]}
      - AUTH_MOCK_ENABLED=${AUTH_MOCK_ENABLED:-false}
    ports:
      - "${API_PORT:-5008}:8000"
    depends_on:
      - base-mongo

  base-mongo:
    image: mongo:${MONGO_VERSION:-6}
    container_name: base-mongo
    volumes:
      - base_mongo_data:/data/db

  base-mongo-express:
    image: mongo-express:${MONGO_EXPRESS_VERSION:-1.0.0-alpha.4}
    container_name: base-mongo-express
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=base-mongo
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      - base-mongo
    restart: unless-stopped

volumes:
  base_mongo_data:
